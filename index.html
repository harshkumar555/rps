<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        <div class="choices">
            <button id="rock" class="choice-btn">Rock</button>
            <button id="paper" class="choice-btn">Paper</button>
            <button id="scissors" class="choice-btn">Scissors</button>
        </div>
        <div id="result">
            <p>Your Choice: <span id="your-choice"></span></p>
            <p>Computer's Choice: <span id="computer-choice"></span></p>
            <h2 id="game-result"></h2>
        </div>
        <button id="reset" class="reset-btn">Play Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
